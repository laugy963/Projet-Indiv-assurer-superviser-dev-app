# Émetteur de certificats du cluster local (fiche 0010).
# En local, aucune autorité publique ne peut joindre le poste : cert-manager signe avec une autorité de
# certification locale. C'est celle du bac à sable (expérimentation 2), décrite ici à l'identique :
# rejouer l'un ou l'autre ne réémet rien.
# Sur l'environnement distant, cet émetteur sera remplacé par un émetteur ACME (Let's Encrypt) :
# seule l'annotation des Ingress change.
#
# 1. Un émetteur auto-signé, qui ne sert qu'à signer le certificat de l'autorité locale.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: auto-signe
spec:
  selfSigned: {}
---
# 2. Le certificat de l'autorité de certification locale. Sa clé privée reste dans un Secret du cluster.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ac-locale
  namespace: cert-manager
spec:
  isCA: true
  commonName: AC locale du bac a sable
  secretName: ac-locale
  duration: 8760h            # un an
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: auto-signe
    kind: ClusterIssuer
---
# 3. L'émetteur désigné par les Ingress : il signe avec l'autorité locale.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ac-locale
spec:
  ca:
    secretName: ac-locale
