# Service de démonstration exposé en HTTPS : il renvoie la requête qu'il a reçue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          args: ["--port=8080"]            # port supérieur à 1024 : le conteneur n'est pas root
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          readinessProbe:
            httpGet: {path: /health, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
spec:
  selector: {app: whoami}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# L'Ingress demande son certificat par une simple annotation : cert-manager crée le Secret « api-tls ».
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami
  annotations:
    cert-manager.io/cluster-issuer: ac-locale
    # Durée volontairement très courte, pour observer un renouvellement pendant le test.
    # run.sh retire ces deux annotations à la fin : le certificat reprend la durée par défaut (90 jours).
    cert-manager.io/duration: 1h
    cert-manager.io/renew-before: 59m
spec:
  ingressClassName: traefik
  tls:
    - hosts: [api.epouvante.test]
      secretName: api-tls
  rules:
    - host: api.epouvante.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: whoami, port: {name: http}}
