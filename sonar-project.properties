# Analyse SonarQube Cloud du prototype : job « qualite » du pipeline, indicateurs I3 (maintenabilité) et I4 (fiabilité).
# Les deux clés identifient le projet ; ce ne sont pas des secrets. Le jeton, lui, est un secret du dépôt GitHub.
sonar.organization=laugy963
sonar.projectKey=laugy963_Projet-Indiv-assurer-superviser-dev-app

sonar.sourceEncoding=UTF-8

# Périmètre. SonarQube Cloud analyse tout le dépôt : dans cette organisation, « sonar.sources » et « sonar.tests »
# n'ont plus d'effet (avertissement du scanner, exécution du 14 novembre 2026). On ne peut que retirer des fichiers.
# Le bac à sable est du code d'expérimentation, pas le produit : il est retiré de l'analyse, comme il l'est du lint.
sonar.exclusions=sandbox/**

# Couverture : les rapports lcov des tests unitaires et des tests d'intégration, téléchargés par le job.
# SonarQube Cloud les additionne : une ligne est couverte si l'un des deux niveaux l'exécute.
sonar.javascript.lcov.reportPaths=reports/**/lcov.info
# Fichiers retirés du calcul de couverture. Ils restent analysés : leurs défauts sont comptés.
#  - Le code de test : on ne teste pas les tests. SonarQube Cloud ne reconnaît de lui-même que le dossier tests/
#    de la racine ; les tests rangés dans chaque paquet sont désignés ici.
#  - Les fichiers de configuration (.cjs, .mjs).
#  - Le code de démarrage, écarté aussi dans les configurations Jest : il ne s'exécute que dans les conteneurs.
sonar.coverage.exclusions=**/*.spec.ts,services/*/test/**,libs/socle/outils-de-test/**,**/*.cjs,**/*.mjs,**/src/main.ts,**/src/migrer.ts,libs/socle/src/index.ts,libs/socle/src/demarrage.ts

# Le job attend le verdict du quality gate (5 minutes au plus) et échoue s'il n'est pas tenu : c'est ce qui le rend bloquant.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
