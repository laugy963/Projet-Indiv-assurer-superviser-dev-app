# Analyse SonarQube Cloud du prototype : job « qualite » du pipeline, indicateurs I3 (maintenabilité) et I4 (fiabilité).
# Les deux clés identifient le projet ; ce ne sont pas des secrets. Le jeton, lui, est un secret du dépôt GitHub.
sonar.organization=A_COMPLETER
sonar.projectKey=A_COMPLETER

sonar.sourceEncoding=UTF-8

# Code analysé : le socle et les deux services. Le bac à sable (sandbox/) est du code d'expérimentation, pas le produit.
sonar.sources=libs/socle/src,services/annonces/src,services/notifications/src
# Les tests unitaires sont rangés à côté du code : ils sont retirés du code analysé…
sonar.exclusions=**/*.spec.ts

# … et déclarés comme code de test, avec les outils de test, les tests d'intégration et les tests d'acceptation.
# Le code de test est analysé avec ses propres règles ; il ne compte ni dans la couverture ni dans la duplication.
sonar.tests=libs/socle/src,libs/socle/outils-de-test,services/annonces/src,services/annonces/test,services/notifications/src,services/notifications/test,tests/acceptation/src
sonar.test.inclusions=**/*.spec.ts,libs/socle/outils-de-test/**,services/*/test/**,tests/acceptation/src/**

# Couverture : les rapports lcov des tests unitaires et des tests d'intégration, téléchargés par le job.
# SonarQube Cloud les additionne : une ligne est couverte si l'un des deux niveaux l'exécute.
sonar.javascript.lcov.reportPaths=reports/**/lcov.info
# Mêmes exclusions que dans les configurations Jest : ce code de démarrage ne s'exécute que dans les conteneurs,
# pendant les tests d'acceptation, qui ne mesurent pas la couverture.
sonar.coverage.exclusions=**/src/main.ts,**/src/migrer.ts,libs/socle/src/index.ts,libs/socle/src/demarrage.ts

# Le job attend le verdict du quality gate (5 minutes au plus) et échoue s'il n'est pas tenu : c'est ce qui le rend bloquant.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
